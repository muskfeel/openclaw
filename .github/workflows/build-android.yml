name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [zh-translation]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build ThirdParty Debug APK
        run: |
          cd apps/android
          chmod +x gradlew
          ./gradlew :app:assembleThirdPartyDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-android-zh
          path: apps/android/app/build/outputs/apk/thirdParty/debug/*.apk
